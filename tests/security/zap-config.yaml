# OWASP ZAP Automation Framework Configuration
# ForgeWorks Security Testing
#
# Usage:
#   docker run -v $(pwd):/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
#     zap.sh -cmd -autorun /zap/wrk/tests/security/zap-config.yaml
#
# Documentation:
#   https://www.zaproxy.org/docs/automate/automation-framework/

---
env:
  contexts:
    - name: "ForgeWorks"
      urls:
        - "http://localhost:8000"
      includePaths:
        - "http://localhost:8000/.*"
      excludePaths:
        - ".*\\.js$"
        - ".*\\.css$"
        - ".*\\.png$"
        - ".*\\.jpg$"
        - ".*\\.gif$"
        - ".*\\.ico$"
        - ".*\\.svg$"
        - ".*\\.woff2?$"
        - ".*\\.ttf$"
        - ".*\\.eot$"
      # Authentication configuration (if needed)
      # authentication:
      #   method: "form"
      #   parameters:
      #     loginUrl: "http://localhost:8000/api/v1/auth/login"
      #     loginRequestData: "email={%username%}&password={%password%}"
      #   verification:
      #     method: "response"
      #     loggedInRegex: "\\Qaccess_token\\E"

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Spider to discover content
  - type: spider
    parameters:
      context: "ForgeWorks"
      maxDuration: 5
      maxDepth: 5
      maxChildren: 10

  # OpenAPI import for API endpoints
  - type: openapi
    parameters:
      apiUrl: "http://localhost:8000/openapi.json"
      context: "ForgeWorks"
      targetUrl: "http://localhost:8000"

  # Active scan for vulnerabilities
  - type: activeScan
    parameters:
      context: "ForgeWorks"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 30
      policy: "API-Minimal"

  # Passive scan summary
  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # Generate reports
  - type: report
    parameters:
      template: "risk-confidence-html"
      reportDir: "/zap/wrk/tests/security/reports"
      reportFile: "zap-report.html"
      reportTitle: "ForgeWorks Security Scan Report"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/tests/security/reports"
      reportFile: "zap-report.json"
      reportTitle: "ForgeWorks Security Scan Report"
