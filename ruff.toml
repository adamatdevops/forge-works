# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

# Target Python version
target-version = "py311"

# Line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    ".next",
    ".turbo",
    "alembic/versions",
]

# Fix violations automatically when possible
fix = true

# Show fixes in output
show-fixes = true

[lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # Perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "TRY003",  # Avoid long messages in exceptions
    "ISC001",  # Conflicts with formatter
]

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Tests can have magic values and unused arguments
"**/tests/**/*.py" = ["PLR2004", "ARG001", "ARG002", "S101"]
# Init files can have unused imports
"**/__init__.py" = ["F401", "F403"]
# Migrations can be messy
"**/alembic/versions/*.py" = ["ALL"]
# Scripts might have prints
"**/scripts/*.py" = ["T201"]

[lint.isort]
# isort configuration
known-first-party = ["app"]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true

[lint.flake8-quotes]
# Prefer double quotes
inline-quotes = "double"
docstring-quotes = "double"

[lint.flake8-tidy-imports]
# Ban relative imports
ban-relative-imports = "all"

[lint.flake8-type-checking]
# Move imports to TYPE_CHECKING block when only used for annotations
strict = true

[lint.pylint]
# Maximum number of branches in a function
max-branches = 12
# Maximum number of returns in a function
max-returns = 6
# Maximum number of statements in a function
max-statements = 50

[lint.mccabe]
# Maximum complexity
max-complexity = 10

[format]
# Format configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
