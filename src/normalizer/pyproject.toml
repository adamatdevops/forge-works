[project]
name = "normalizer"
version = "0.2.0"
description = "ForgeWorks Configuration Normalizer — transforms K8s/Terraform/CI configs into unified CUE representations"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# `cue/` lives next to `app/` for schema co-location; exclude it from packaging.
# Auto-discover `app` and all subpackages (e.g. `app.normalizers`, `app.routes`)
# so newly added subpackages don't get silently dropped from the wheel.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["cue*", "tests*"]
