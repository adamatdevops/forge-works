[project]
name = "label-schema-validator"
version = "0.1.0"
description = "ForgeWorks Dynamic Reliability label-schema validator — enforces GROUND_TRUTH_INTERVENTION_CONTRACT.md v0.3 rules per AB-030 RFC v0.4"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_works*"]
namespaces = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
