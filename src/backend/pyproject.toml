[project]
name = "forge-works"
version = "0.4.0"
description = "ForgeWorks - Internal Developer Platform (Platform Orchestrator)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    # Authentication
    "PyJWT>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",  # Pin bcrypt <5.0 for passlib 1.7.x compatibility
    "email-validator>=2.1.0",
    "greenlet>=3.3.0",
    "numpy>=2.4.1",
    # Observability
    "sentry-sdk>=2.0.0",  # FastAPI integration auto-enabled when fastapi is installed
    # Explicit CVE floor — transitive via types-pyopenssl→types-redis (dev extra only,
    # no runtime import path uses `cryptography` directly). Pinned here to close 7
    # Dependabot alerts against cryptography 46.0.3 without waiting for types-redis
    # to bump its own pin. Kept in sync with tools/forge-skills-mcp/pyproject.toml.
    "cryptography>=50.0.0",  # CVE-2026-69249/69247/26007/69248/39892/34073 + GHSA-537c-gmf6-5ccf
    # Explicit CVE floors for backend transitives — closes 6 Dependabot alerts
    # (Tier 2 PR-G of transitive-alert initiative). Pinned here rather than waiting
    # for alembic/kubernetes/sentry-sdk/requests-oauthlib to bump their own pins.
    "urllib3>=2.7.0",       # CVE-2026-44431 (High, cross-origin header leak on proxied redirects) + CVE-2026-44432 (High, decompression-bomb bypass) — transitive via sentry-sdk, kubernetes, requests
    "Mako>=1.3.12",         # CVE-2026-44307 (High, backslash path traversal on Windows) + CVE-2026-41205 (High, double-slash prefix path traversal) — transitive via alembic
    "Pygments>=2.20.0",     # CVE-2026-4539 (Low, ReDoS in GUID regex) — transitive via pytest→rich and sentry-sdk
    "requests>=2.33.0",     # CVE-2026-25645 (Medium, insecure temp-file reuse in extract_zipped_paths) — transitive via kubernetes and requests-oauthlib
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Type stubs
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]
k8s = [
    "kubernetes>=29.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line length handled by formatter
    # UP042: `class X(str, Enum)` -> `enum.StrEnum`. Suppressed because StrEnum
    # changes `str(X.A)` semantics and the codebase has 27+ existing classes
    # using the (str, Enum) pattern. Migration is a behavioral change disguised
    # as a lint fix; defer to a focused PR with explicit per-class testing.
    # Mirrors root ruff.toml ignore for consistency.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Allow untyped decorators from third-party libraries
disallow_untyped_decorators = false

# Allow generic types without parameters (dict instead of dict[str, Any])
disallow_any_generics = false

# Ignore test files - tests don't need strict typing
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Adapters deal with external APIs and mocking - relax typing
[[tool.mypy.overrides]]
module = "app.adapters.*"
ignore_errors = true

# DB models use SQLAlchemy patterns that mypy struggles with
[[tool.mypy.overrides]]
module = "app.db.models.*"
disallow_any_generics = false

# API routes - FastAPI decorators and SQLAlchemy queries have complex types
[[tool.mypy.overrides]]
module = [
    "app.api.routes.*",
    "app.api.deps",
]
ignore_errors = true

# CRUD operations - SQLAlchemy session patterns
[[tool.mypy.overrides]]
module = "app.crud.*"
ignore_errors = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "asyncpg.*",
    "uvicorn.*",
    "kubernetes.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
