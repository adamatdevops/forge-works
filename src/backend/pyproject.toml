[project]
name = "forge-works"
version = "0.4.0"
description = "ForgeWorks - Internal Developer Platform (Platform Orchestrator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",  # Pin bcrypt <5.0 for passlib 1.7.x compatibility
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Type stubs
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]
k8s = [
    "kubernetes>=29.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Allow untyped decorators from third-party libraries
disallow_untyped_decorators = false

# Allow generic types without parameters (dict instead of dict[str, Any])
disallow_any_generics = false

# Ignore test files - tests don't need strict typing
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Adapters deal with external APIs and mocking - relax typing
[[tool.mypy.overrides]]
module = "app.adapters.*"
ignore_errors = true

# DB models use SQLAlchemy patterns that mypy struggles with
[[tool.mypy.overrides]]
module = "app.db.models.*"
disallow_any_generics = false

# API routes - FastAPI decorators and SQLAlchemy queries have complex types
[[tool.mypy.overrides]]
module = [
    "app.api.routes.*",
    "app.api.deps",
]
ignore_errors = true

# CRUD operations - SQLAlchemy session patterns
[[tool.mypy.overrides]]
module = "app.crud.*"
ignore_errors = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "asyncpg.*",
    "uvicorn.*",
    "kubernetes.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
