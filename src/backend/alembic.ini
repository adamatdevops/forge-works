# ForgeWorks Alembic Configuration

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Prepend system path for imports
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Version location specification
version_locations = %(here)s/alembic/versions

# Truncate revision on filesystem to 40 characters
truncate_slug_length = 40

# Set to 'true' to run offline migrations
# revision_environment = false

# Set to 'true' to enable post-write hooks
# post_write_hooks = false

[post_write_hooks]
# Hooks for auto-formatting migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
