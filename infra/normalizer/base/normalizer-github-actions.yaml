---
apiVersion: v1
kind: ConfigMap
metadata:
  name: normalizer-github-actions-config
  namespace: forge-engine
data:
  FW_KAFKA_BOOTSTRAP_SERVERS: "forge-kafka-kafka-bootstrap.forge-engine.svc.cluster.local:9092"
  FW_KAFKA_INPUT_TOPIC: "forge.events.github_actions"
  FW_KAFKA_OUTPUT_TOPIC: "forge.config.normalized"
  FW_KAFKA_DLQ_TOPIC: "forge.dlq.events"
  FW_KAFKA_CONSUMER_GROUP: "normalizer-github-actions"
  FW_EXPECTED_SOURCE: "github-actions"
  FW_S3_BUCKET: "fw-state-dev"
  # Prefix is shared; per-source partition comes from resource_ref encoding
  # (writes land under normalizer/configs/github-actions/... — matches IAM policy)
  FW_S3_PREFIX: "normalizer/configs"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalizer-github-actions
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: normalizer-github-actions
    app.kubernetes.io/part-of: forge-works
    app.kubernetes.io/component: normalization
    forge.normalizer.source: github-actions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: normalizer-github-actions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: normalizer-github-actions
        app.kubernetes.io/part-of: forge-works
        app.kubernetes.io/component: normalization
        forge.normalizer.source: github-actions
    spec:
      serviceAccountName: normalizer-github-actions-sa
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: normalizer
          image: ghcr.io/adamatdevops/forge-works/normalizer:main-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: normalizer-github-actions-config
          env:
            - name: FW_REDIS_HOST
              value: "forge-redis-master.forge-engine.svc"
            - name: FW_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forge-redis-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: normalizer-github-actions
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: normalizer-github-actions
    app.kubernetes.io/part-of: forge-works
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: normalizer-github-actions
  ports:
    - port: 8095
      targetPort: http
      protocol: TCP
      name: http
