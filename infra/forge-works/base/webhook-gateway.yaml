---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-gateway-config
  namespace: forge-works
data:
  FW_APP_NAME: "webhook-gateway"
  FW_KAFKA_BOOTSTRAP_SERVERS: "forge-kafka-kafka-bootstrap.forge-engine.svc.cluster.local:9092"
  FW_KAFKA_TOPIC_GITHUB: "forge.events.github"
  FW_KAFKA_TOPIC_ARGOCD: "forge.events.argocd"
  FW_KAFKA_TOPIC_KUBERNETES: "forge.events.kubernetes"
  FW_KAFKA_TOPIC_DLQ: "forge.dlq.events"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-gateway
  namespace: forge-works
  labels:
    app.kubernetes.io/name: webhook-gateway
    app.kubernetes.io/part-of: forge-works
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-gateway
        app.kubernetes.io/part-of: forge-works
        app.kubernetes.io/component: ingestion
    spec:
      serviceAccountName: webhook-gateway-sa
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-gateway
          image: ghcr.io/adamatdevops/forge-works/webhook-gateway:dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: webhook-gateway-config
          env:
            - name: FW_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-gateway-secrets
                  key: github-webhook-secret
                  optional: true
            - name: FW_ARGOCD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-gateway-secrets
                  key: argocd-webhook-secret
                  optional: true
            - name: FW_KUBERNETES_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webhook-gateway-secrets
                  key: kubernetes-webhook-token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-gateway
  namespace: forge-works
  labels:
    app.kubernetes.io/name: webhook-gateway
    app.kubernetes.io/part-of: forge-works
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook-gateway
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
