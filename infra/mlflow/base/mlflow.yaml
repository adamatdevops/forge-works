---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: forge-ml
data:
  MLFLOW_BACKEND_STORE_URI: "postgresql://forgeworks:$(PG_PASSWORD)@forge-postgres-postgresql.forge-engine.svc:5432/mlflow"
  MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://fw-models-dev/mlflow/artifacts"
  MLFLOW_HOST: "0.0.0.0"
  MLFLOW_PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: forge-ml
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: forge-works
    app.kubernetes.io/component: model-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: forge-works
        app.kubernetes.io/component: model-registry
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.19.0
          command: ["bash", "-c"]
          args:
            - |
              pip install --quiet psycopg2-binary boto3 &&
              mlflow server \
                --backend-store-uri "$(BACKEND_STORE_URI)" \
                --default-artifact-root "$(ARTIFACT_ROOT)" \
                --host 0.0.0.0 \
                --port 5000
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secret
                  key: password
            - name: BACKEND_STORE_URI
              value: "postgresql://forgeworks:$(PG_PASSWORD)@forge-postgres-postgresql.forge-engine.svc:5432/mlflow"
            - name: ARTIFACT_ROOT
              value: "s3://fw-models-dev/mlflow/artifacts"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: forge-ml
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: forge-works
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
