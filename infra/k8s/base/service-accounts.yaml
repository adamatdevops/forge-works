  labels:
    app.kubernetes.io/part-of: forgeworks
    app.kubernetes.io/component: webhook-gateway
  annotations:
    description: "Service account for Webhook Gateway"
---
# === FORGE-ML NAMESPACE ===
apiVersion: v1
kind: ServiceAccount
metadata:
