# ForgeWorks Service Accounts
# Sprint I-1: Namespaces & RBAC
---
# === FORGE-ENGINE NAMESPACE ===
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-sa
  namespace: forge-engine
  labels:
    app.kubernetes.io/part-of: forgeworks
    app.kubernetes.io/component: kafka
  annotations:
    description: "Service account for Kafka brokers (Strimzi)"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-sa
  namespace: forge-engine
  labels:
    app.kubernetes.io/part-of: forgeworks
    app.kubernetes.io/component: flink
  annotations:
    description: "Service account for Flink JobManager and TaskManagers"
    eks.amazonaws.com/role-arn: arn:aws:iam::525320085763:role/fw-forge-engine-flink-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: normalizer-sa
  namespace: forge-engine
  labels:
    app.kubernetes.io/part-of: forgeworks
    app.kubernetes.io/component: normalizer
  annotations:
    description: "Service account for the configuration Normalizer"
    eks.amazonaws.com/role-arn: arn:aws:iam::525320085763:role/fw-forge-engine-normalizer-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-sa
  namespace: forge-engine
  labels:
    app.kubernetes.io/part-of: forgeworks
    app.kubernetes.io/component: airflow
  annotations:
    description: "Service account for Airflow scheduler and workers"
---
