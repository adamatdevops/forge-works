---
# Frontend role - very minimal (only needs configmaps for runtime config)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: forge-works
  labels:
    app.kubernetes.io/part-of: forgeworks
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-role-binding
  namespace: forge-works
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-role
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: forge-works
---
# === FORGE-ML ROLES ===

# ML Runner role - needs to create pods for training jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-runner-role
  namespace: forge-ml
  labels:
    app.kubernetes.io/part-of: forgeworks
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-runner-role-binding
  namespace: forge-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-runner-role
subjects:
  - kind: ServiceAccount
    name: ml-runner-sa
    namespace: forge-ml
---
# ML Inference role - read-only for models, minimal pod access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-inference-role
  namespace: forge-ml
  labels:
    app.kubernetes.io/part-of: forgeworks
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-inference-role-binding
  namespace: forge-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-inference-role
subjects:
  - kind: ServiceAccount
    name: ml-inference-sa
    namespace: forge-ml
---
# === CROSS-NAMESPACE ACCESS ===

# Airflow needs to trigger ML jobs in forge-ml namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-ml-trigger-role
  namespace: forge-ml
  labels:
    app.kubernetes.io/part-of: forgeworks
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-ml-trigger-binding
  namespace: forge-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-ml-trigger-role
subjects:
  - kind: ServiceAccount
    name: airflow-sa
    namespace: forge-engine
