apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: pattern-matcher
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: pattern-matcher
    app.kubernetes.io/part-of: forge-works
    app.kubernetes.io/component: stream-processor
    environment: dev
spec:
  image: ghcr.io/adamatdevops/forge-works/pattern-matcher:dev-v4
  flinkVersion: v1_20
  serviceAccount: flink-sa
  flinkConfiguration:
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
    state.backend.type: rocksdb
    state.backend.incremental: "true"
    state.checkpoints.dir: s3://fw-state-dev/flink/pattern-matcher/checkpoints
    state.savepoints.dir: s3://fw-state-dev/flink/pattern-matcher/savepoints
    state.checkpoints.num-retained: "3"
    high-availability.type: kubernetes
    high-availability.storageDir: s3://fw-state-dev/flink/pattern-matcher/ha
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 1s
    restart-strategy.exponential-delay.max-backoff: 60s
    kafka.bootstrap.servers: forge-kafka-kafka-bootstrap.forge-engine.svc.cluster.local:9092
    fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
    fs.s3a.endpoint: s3.us-east-1.amazonaws.com
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: "1536m"
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: "2048m"
  podTemplate:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: install-s3-plugin
          image: ghcr.io/adamatdevops/forge-works/pattern-matcher:dev-v4
          command: ["bash", "-c"]
          args:
            - |
              mkdir -p /opt/flink/plugins/s3-fs-hadoop &&
              cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/plugins/s3-fs-hadoop/
          volumeMounts:
            - name: flink-plugins
              mountPath: /opt/flink/plugins
      containers:
        - name: flink-main-container
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: forge-kafka-kafka-bootstrap.forge-engine.svc.cluster.local:9092
          volumeMounts:
            - name: flink-data
              mountPath: /flink-data
            - name: flink-plugins
              mountPath: /opt/flink/plugins
      volumes:
        - name: flink-data
          emptyDir: {}
        - name: flink-plugins
          emptyDir: {}
  job:
    jarURI: local:///opt/flink/usrlib/pattern-matcher.jar
    entryClass: dev.forgeworks.engine.patterns.PatternMatcherJob
    parallelism: 1
    upgradeMode: last-state
