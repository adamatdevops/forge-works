apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: kafka-metrics
    app.kubernetes.io/part-of: forge-works
data:
  kafka-metrics-config.yml: |
    # Kafka JMX Exporter Configuration
    lowercaseOutputName: true
    rules:
    # Broker metrics
    - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
      name: kafka_server_$1_$2
      type: GAUGE
      labels:
        clientId: "$3"
        topic: "$4"
        partition: "$5"
    - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
      name: kafka_server_$1_$2
      type: GAUGE
      labels:
        clientId: "$3"
        broker: "$4:$5"
    - pattern: kafka.server<type=(.+), name=(.+)><>Value
      name: kafka_server_$1_$2
      type: GAUGE

    # Request metrics
    - pattern: kafka.network<type=(.+), name=(.+), request=(.+), error=(.+)><>Count
      name: kafka_network_$1_$2_$3_error_count
      type: COUNTER
      labels:
        error: "$4"
    - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>Count
      name: kafka_network_$1_$2_$3_count
      type: COUNTER
    - pattern: kafka.network<type=(.+), name=(.+)><>Value
      name: kafka_network_$1_$2
      type: GAUGE

    # Log metrics
    - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
      name: kafka_log_$1_$2
      type: GAUGE
      labels:
        topic: "$3"
        partition: "$4"

    # Controller metrics
    - pattern: kafka.controller<type=(.+), name=(.+)><>Value
      name: kafka_controller_$1_$2
      type: GAUGE

  zookeeper-metrics-config.yml: |
    # ZooKeeper JMX Exporter Configuration
    lowercaseOutputName: true
    rules:
    - pattern: "org.apache.ZooKeeperService<name0=(.+)><>AvgRequestLatency"
      name: zookeeper_avg_request_latency
      type: GAUGE
    - pattern: "org.apache.ZooKeeperService<name0=(.+)><>NumAliveConnections"
      name: zookeeper_alive_connections
      type: GAUGE
    - pattern: "org.apache.ZooKeeperService<name0=(.+)><>OutstandingRequests"
      name: zookeeper_outstanding_requests
      type: GAUGE
