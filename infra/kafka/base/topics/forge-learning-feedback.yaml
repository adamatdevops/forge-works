apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: forge.learning.feedback
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-learning-feedback
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: learning
    forge.topic.type: feedback
spec:
  # User feedback for model improvement
  # Key: correlation_id
  # Partitioning: 3 partitions (lower volume)
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000        # 30 days (for model training)
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 268435456        # 256MB segments (low volume)
    max.message.bytes: 1048576      # 1MB max message (feedback is small)
