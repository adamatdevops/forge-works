apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: forge.events.terraform
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-events-terraform
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: events
    forge.topic.source: terraform
    strimzi.io/cluster: forge-kafka
spec:
  # Terraform plan/state events (resource attributes)
  # Key: resource address ("module.x.aws_ecs_task_definition.api")
  # Partitioning: 6 partitions for parallel processing
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000         # 7 days
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 1073741824       # 1GB segments
    max.message.bytes: 10485760     # 10MB max message
