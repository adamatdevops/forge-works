apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: forge.jobs.results
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-jobs-results
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: jobs
    forge.topic.stage: completed
    strimzi.io/cluster: forge-kafka
spec:
  # Job completion results
  # Key: job_id
  # Partitioning: 6 partitions for parallel result processing
  partitions: 6
  replicas: 3
  config:
    retention.ms: 1209600000        # 14 days (longer for auditing)
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 536870912        # 512MB segments
    max.message.bytes: 10485760     # 10MB max message
