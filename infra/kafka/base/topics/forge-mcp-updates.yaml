apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: forge.mcp.updates
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-mcp-updates
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: mcp
    forge.topic.type: updates
spec:
  # Template/pattern updates from MCP library
  # Key: template_name
  # Partitioning: 3 partitions (low volume, ordered by template)
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000        # 30 days
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 268435456        # 256MB segments
    max.message.bytes: 52428800     # 50MB max message (templates can be large)
