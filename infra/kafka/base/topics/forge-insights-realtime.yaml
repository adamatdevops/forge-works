apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: forge.insights.realtime
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-insights-realtime
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: insights
    forge.topic.producer: flink
    strimzi.io/cluster: forge-kafka
spec:
  # Flink outputs (real-time insights)
  # Key: correlation_id
  # Partitioning: 6 partitions for parallel consumption
  partitions: 6
  replicas: 3
  config:
    retention.ms: 1209600000        # 14 days (longer for insights)
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 1073741824       # 1GB segments
    max.message.bytes: 10485760     # 10MB max message
