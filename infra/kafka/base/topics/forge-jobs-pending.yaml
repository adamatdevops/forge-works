apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: forge.jobs.pending
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-jobs-pending
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: jobs
    forge.topic.stage: pending
spec:
  # Job specs waiting for execution
  # Key: job_id
  # Partitioning: 6 partitions for parallel job dispatch
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000         # 7 days
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 536870912        # 512MB segments (jobs are smaller)
    max.message.bytes: 10485760     # 10MB max message
