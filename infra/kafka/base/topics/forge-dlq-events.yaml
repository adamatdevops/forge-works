apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: forge.dlq.events
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-dlq-events
    app.kubernetes.io/part-of: forge-works
    forge.topic.category: dlq
    forge.topic.type: dead-letter
spec:
  # Dead Letter Queue for failed event processing
  # Key: original_topic
  # Partitioning: 3 partitions (low volume, hopefully!)
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000        # 30 days (for debugging)
    retention.bytes: -1             # No size limit
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 268435456        # 256MB segments
    max.message.bytes: 52428800     # 50MB max (preserve original message)
