# ForgeWorks Kafka Cluster - KRaft Mode (No ZooKeeper)
# Strimzi 0.50.0 + KRaft
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: forge-kafka
  namespace: forge-engine
  labels:
    app.kubernetes.io/name: forge-kafka
    app.kubernetes.io/part-of: forge-works
    app.kubernetes.io/component: event-bus
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.1.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # Topic settings
      auto.create.topics.enable: "false"
      delete.topic.enable: "true"

      # Replication settings
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2

      # Retention settings
      log.retention.hours: 168  # 7 days
      log.retention.bytes: -1   # No size limit

      # Performance tuning
      num.network.threads: 3
      num.io.threads: 8
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600

      # Message size
      message.max.bytes: 10485760  # 10MB

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
