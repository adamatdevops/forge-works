apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: forge-kafka-prod

namespace: forge-engine

resources:
  - ../../base

commonLabels:
  environment: prod

# Production enhancements
patches:
  # Increase storage and resources for production
  - patch: |-
      - op: replace
        path: /spec/kafka/storage/volumes/0/size
        value: 500Gi
      - op: replace
        path: /spec/kafka/resources/requests/memory
        value: 4Gi
      - op: replace
        path: /spec/kafka/resources/limits/memory
        value: 8Gi
      - op: replace
        path: /spec/kafka/resources/requests/cpu
        value: 1000m
      - op: replace
        path: /spec/kafka/resources/limits/cpu
        value: 4000m
      - op: replace
        path: /spec/zookeeper/storage/size
        value: 50Gi
      - op: replace
        path: /spec/zookeeper/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/zookeeper/resources/limits/memory
        value: 2Gi
    target:
      group: kafka.strimzi.io
      version: v1
      kind: Kafka
      name: forge-kafka
