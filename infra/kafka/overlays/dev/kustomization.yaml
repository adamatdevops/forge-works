apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: forge-kafka-dev

namespace: forge-engine

resources:
  - ../../base

commonLabels:
  environment: dev

# Development overrides
patches:
  # Reduce Kafka brokers to 1 for dev
  - patch: |-
      - op: replace
        path: /spec/kafka/replicas
        value: 1
      - op: replace
        path: /spec/kafka/storage/volumes/0/size
        value: 10Gi
      - op: replace
        path: /spec/kafka/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/kafka/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/zookeeper/replicas
        value: 1
      - op: replace
        path: /spec/zookeeper/storage/size
        value: 5Gi
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: Kafka
      name: forge-kafka

  # Reduce topic replicas to 1 for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/partitions
        value: 2
      - op: replace
        path: /spec/config/min.insync.replicas
        value: 1
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaTopic
