apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: forge-kafka-dev

namespace: forge-engine

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false

# Dev overrides - reduce resources for t3.large nodes
patches:
  # Reduce Kafka config for single broker
  - patch: |-
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
    target:
      group: kafka.strimzi.io
      version: v1
      kind: Kafka
      name: forge-kafka

  # Reduce node pool to 1 replica with less resources
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/storage/volumes/0/size
        value: 10Gi
      - op: replace
        path: /spec/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/resources/limits/cpu
        value: 1000m
    target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: forge-kafka-pool

  # Reduce topic replicas to 1 for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/partitions
        value: 2
      - op: replace
        path: /spec/config/min.insync.replicas
        value: 1
    target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaTopic
