# Frontend Route - Next.js on port 3000
# Default catch-all route (lowest priority)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: forge-works
spec:
  parentRefs:
    - name: forgeworks-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
