# Webhook Gateway Route - Event ingestion on port 8080
# Matches /webhook/* paths (GitHub, ArgoCD callbacks)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-gateway
  namespace: forge-works
spec:
  parentRefs:
    - name: forgeworks-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: webhook-gateway
          port: 8080
