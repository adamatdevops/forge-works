# Backend API Route - FastAPI on port 8000
# Matches /api/* paths
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-api
  namespace: forge-works
spec:
  parentRefs:
    - name: forgeworks-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8000
