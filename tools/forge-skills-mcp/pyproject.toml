[project]
name = "forge-skills-mcp"
version = "0.1.0"
description = "Dual-agent MCP skill loader for forge-works (Claude Code + Codex CLI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "adamatdevops" }]
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.28.1,<2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Explicit CVE floors — transitive via mcp but mcp's own constraints
    # don't pull the CVE-fixed versions. Kept in sync with src/backend/pyproject.toml.
    "pyjwt>=2.13.0",  # CVE-2026-48522/48523/48524/48525/48526 (fixed in 2.13.0)
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j (fixed in 2.14.2)
    "cryptography>=50.0.0",  # CVE-2026-69249/69247/69248 + GHSA-537c-gmf6-5ccf (transitive via pyjwt[crypto] / mcp[crypto])
    "python-multipart>=0.0.31",  # CVE-2026-53539 (High, 7.5) + CVE-2026-53540/53538/53537 (Low) — transitive via mcp HTTP form-data transport
]

[project.scripts]
forge-skills-mcp = "forge_skills_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_skills_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
