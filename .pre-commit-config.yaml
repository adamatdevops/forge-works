# Pre-commit hook configuration for forge-works
# See docs/PRE_COMMIT_EVALUATION.md for which hooks were chosen and why.
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# Update:    pre-commit autoupdate

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.11

# Don't run on commits to these branches (used for autogenerated commits)
# default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # Tier 1 — built-in hygiene (instant, auto-fix)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|patch|diff)$
      - id: end-of-file-fixer
        exclude: \.(svg|patch|diff)$
      - id: check-yaml
        # Allow Helm/templates with custom tags
        args: [--unsafe]
        exclude: ^(infra/.*/templates/|.*charts/.*/templates/)
      - id: check-json
        exclude: \.jsonc$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------------------
  # Tier 1 — Python lint + format (mirrors CI)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Tier 1 — Frontend formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown]
        # Don't fight ruff/markdownlint on Python or backend YAML
        exclude: |
          (?x)^(
            src/backend/|
            src/normalizer/|
            src/webhook-gateway/|
            src/job-dispatcher/|
            infra/|
            .github/workflows/|
            pnpm-lock\.yaml$
          )

  # ---------------------------------------------------------------------------
  # Tier 2 — YAML lint (matches CI .yamllint config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint, --strict]

  # ---------------------------------------------------------------------------
  # Tier 2 — Markdown lint (matches CI .markdownlint.jsonc config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        exclude: |
          (?x)^(
            node_modules/|
            \.history/|
            .*/CHANGELOG\.md$
          )

  # ---------------------------------------------------------------------------
  # Tier 2 — Shell script lint
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ---------------------------------------------------------------------------
  # Tier 2 — Dockerfile lint (matches CI hadolint config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.9.3
    hooks:
      - id: hadolint
        args: [--failure-threshold=warning]

  # ---------------------------------------------------------------------------
  # Tier 2 — Secret detection (local lighter twin of CI gitleaks)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            \.secrets\.baseline$|
            pnpm-lock\.yaml$|
            .*\.lock$
          )
