# Pre-commit hook configuration for forge-works
# See docs/PRE_COMMIT_EVALUATION.md for which hooks were chosen and why.
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# Update:    pre-commit autoupdate

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.11

# Don't run on commits to these branches (used for autogenerated commits)
# default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # Tier 1 — built-in hygiene (instant, auto-fix)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|patch|diff)$
      - id: end-of-file-fixer
        exclude: \.(svg|patch|diff)$
      - id: check-yaml
        # Allow Helm/templates with custom tags
        args: [--unsafe]
        exclude: ^(infra/.*/templates/|.*charts/.*/templates/)
      - id: check-json
        exclude: \.jsonc$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------------------
  # Tier 1 — Python lint + format (mirrors CI)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^\.skills/
      - id: ruff-format
        exclude: ^\.skills/

  # ---------------------------------------------------------------------------
  # Tier 1 — Frontend formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown]
        # Don't fight ruff/markdownlint on Python or backend YAML
        exclude: |
          (?x)^(
            src/backend/|
            src/normalizer/|
            src/webhook-gateway/|
            src/job-dispatcher/|
            infra/|
            .github/workflows/|
            pnpm-lock\.yaml$
          )

  # ---------------------------------------------------------------------------
  # Tier 2 — YAML lint (matches CI .yamllint config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint, --strict]

  # ---------------------------------------------------------------------------
  # Tier 2 — Markdown lint (matches CI .markdownlint.jsonc config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        exclude: |
          (?x)^(
            node_modules/|
            \.history/|
            \.skills/|
            .*/CHANGELOG\.md$
          )

  # ---------------------------------------------------------------------------
  # Tier 2 — Shell script lint
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ---------------------------------------------------------------------------
  # Tier 2 — Dockerfile lint (matches CI hadolint config)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.9.3
    hooks:
      - id: hadolint
        args: [--failure-threshold=warning]

  # ---------------------------------------------------------------------------
  # Tier 2 — Secret detection (local lighter twin of CI gitleaks)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            \.secrets\.baseline$|
            pnpm-lock\.yaml$|
            \.skills/|
            .*\.lock$
          )

  # ---------------------------------------------------------------------------
  # Tier 1 — CUE schema (forge-works normalizer schemas in src/normalizer/cue/)
  #
  # Local hooks invoking the system `cue` binary (no canonical pre-commit-cue
  # repo). Requires `cue` on PATH for contributors; the CI workflow already
  # installs it (see .github/workflows/normalizer-image.yml).
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: cue-fmt
        name: cue fmt (check)
        entry: cue fmt --check --files
        language: system
        files: \.cue$
      - id: cue-vet
        name: cue vet
        entry: bash -c 'cd src/normalizer/cue && cue vet .'
        language: system
        files: ^src/normalizer/cue/.*\.cue$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Terraform: deferred. infra/iam/ is JSON policy docs (not HCL) as of 2026-05;
  # the existing check-json hook already validates syntax. Add antonbabenko/
  # pre-commit-terraform when actual .tf files land in the repo.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Java formatting: NOT in pre-commit.
  #
  # We tried `pretty-format-java` (google-java-format 1.33 via JAR), but its
  # import-handling diverges from Spotless's google-java-format 1.33 inside Maven
  # (likely a JVM-version effect — pre-commit's bundled JRE differs from the
  # build JVM), so they fight each other on every commit.
  #
  # Single source of truth: `mvn spotless:apply` per Flink module. CI's
  # `java-build` job runs `mvn verify` which calls Spotless `check` and fails
  # on drift. Developers should run `mvn spotless:apply` before committing
  # Java changes. See docs/PRE_COMMIT_EVALUATION.md for rationale.
  # ---------------------------------------------------------------------------
