# codex/config.toml

[project]
name = "forge-works"
description = "Internal Developer Platform (Golden Path Orchestrator)"
intent = "Portfolio-grade demonstration of platform engineering, governance-through-design, and ML-assisted decision support."

[principles]
agentless = true
ml_role = "advisory"
governance_model = "design_not_policy"
platform_focus = "orchestration_not_replacement"

[scope]
allow_infrastructure_provisioning = false
allow_cluster_management = false
allow_gitops_control_plane = false
allow_autonomous_ml = false

[ml]
style = "assistive"
explainable = true
override_required = true
confidence_required = true
production_serving = false

[code_generation]
default_behavior = "conservative"
require_explicit_instruction = true
avoid_magic = true

[docs]
external_docs_preferred = true
do_not_copy_external_content = true
assume_docs_are_authoritative = true

[review]
warn_on_scope_creep = true
warn_on_overclaim = true
prefer_design_feedback_over_implementation = true

[context.external]
description = "Authoritative architecture, planning, and governance documents live outside this repository."
location = "External design workspace (ADR, planning, roadmap, and platform doctrine documents)."

rules = [
  "External architecture and planning documents are canonical.",
  "If local code or suggestions conflict with external docs, external docs win.",
  "Do not infer missing requirements beyond documented scope.",
  "Ask before proposing changes that impact architecture, ML posture, or platform boundaries."
]

[mcp_servers]
github = { command = "npx", args = ["-y", "@modelcontextprotocol/server-github"], env = {} }
filesystem = { command = "npx", args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/adamkeinan/git/repos"], env = {} }
memory = { command = "npx", args = ["-y", "@modelcontextprotocol/server-memory"], env = {} }
context7 = { command = "npx", args = ["-y", "@upstash/context7-mcp"], env = {} }
commands = { command = "npx", args = ["-y", "mcp-server-commands"], env = {} }
ragdocs = { command = "npx", args = ["-y", "@iflow-mcp/mcp-ragdocs"], env = {} }
code-index = { command = "npx", args = ["-y", "@hayhandsome/code-index-mcp"], env = {} }
claude-skills = { command = "/Users/adamkeinan/.local/bin/uvx", args = ["claude-skills-mcp"], env = {} }
llm-context = { command = "/Users/adamkeinan/.local/bin/uvx", args = ["--from", "llm-context", "lc-mcp"], env = {} }
mcp-chrome = { url = "http://127.0.0.1:12306" }
sentry = { command = "npx", args = ["-y", "@sentry/mcp-server", "--access-token", "REDACTED"], env = {} }
sequentialthinking = { command = "npx", args = ["-y", "@modelcontextprotocol/server-sequential-thinking"], env = {} }
fetch = { command = "npx", args = ["-y", "mcp-fetch-server"], env = {} }
