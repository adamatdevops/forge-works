name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ==========================================================================
  # Lint Job - Code Quality Checks
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Python tools
        run: |
          pip install ruff mypy

      - name: Install backend dependencies for type checking
        run: |
          cd src/backend
          pip install -e ".[dev]"

      - name: Run Ruff (Python linting)
        run: |
          ruff check src/backend/
          ruff format --check src/backend/

      - name: Run mypy (Python type checking)
        run: |
          cd src/backend
          mypy .

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (TypeScript/React linting)
        run: pnpm --filter @forge-works/frontend lint

      - name: Run TypeScript type check
        run: pnpm --filter @forge-works/frontend typecheck

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint -c .yamllint .

      - name: Run markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint '**/*.md' --ignore node_modules --ignore .history \
            --ignore '**/node_modules/**' --ignore '**/venv/**' --ignore '**/.venv/**'

      - name: Run hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/backend/Dockerfile
          failure-threshold: warning

  # ==========================================================================
  # Security Job - Secret and Vulnerability Scanning
  # ==========================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Snyk (Python)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=src/backend/pyproject.toml

  # ==========================================================================
  # Test Job - Backend Tests
  # ==========================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -e ".[dev,ml]" || pip install \
            pytest pytest-asyncio pytest-cov aiosqlite fastapi uvicorn \
            "pydantic[email]" pydantic-settings sqlalchemy asyncpg alembic \
            redis httpx python-dotenv "python-jose[cryptography]" \
            "passlib[bcrypt]" bcrypt numpy scikit-learn pandas

      - name: Run tests
        run: |
          cd src/backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/forge_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: src/backend/coverage.xml
          fail_ci_if_error: false

  # ==========================================================================
  # Test Job - Frontend Tests
  # ==========================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @forge-works/frontend test --coverage --passWithNoTests
        continue-on-error: true

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: src/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ==========================================================================
  # Build Job - Docker & Frontend Build Verification
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: false
          tags: forge-works/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @forge-works/frontend build
        env:
          NODE_ENV: production

  # ==========================================================================
  # Java Job - Flink jobs build, format check (Spotless), bug detection (SpotBugs)
  # ==========================================================================
  java-build:
    name: Java Build (Flink)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [event-router, insight-generator, pattern-matcher]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run Maven on JDK 17 — Spotless 3.x's plugin classes are compiled for JVM 17+.
      # Bytecode still targets Java 11 via <maven.compiler.source/target>11</> in each pom.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify (compile + test + Spotless check + SpotBugs check)
        run: |
          cd src/flink-jobs/${{ matrix.module }}
          mvn -B verify

  # ==========================================================================
  # All Checks Passed
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, security, test-backend, test-frontend, build, java-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test-backend.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.java-build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
