# Label Sync Workflow
# Syncs labels from .github/labels.yml to the repository

name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

# Minimal workflow-level permissions; the sync job elevates to issues: write.
# Fixes Checkov CKV2_GHA_1.
permissions:
  contents: read

jobs:
  sync:
    name: Sync Labels
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a  # v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          dry-run: false
