name: Normalizer Image

on:
  push:
    branches: [main]
    paths:
      - "src/normalizer/**"
      - ".github/workflows/normalizer-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/normalizer/**"
      - ".github/workflows/normalizer-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/forge-works/normalizer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUE CLI
        run: |
          CUE_VERSION=v0.16.0
          CUE_BASE="https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}"
          CUE_TARBALL="cue_${CUE_VERSION}_linux_amd64.tar.gz"
          curl -sSL "${CUE_BASE}/${CUE_TARBALL}" | sudo tar -C /usr/local/bin -xz cue
          cue version

      - name: Install dependencies
        run: |
          cd src/normalizer
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd src/normalizer
          PYTHONPATH=. pytest tests/ -v

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/normalizer/Dockerfile
          failure-threshold: warning

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    # Only push from main branch; PRs run the test job above and stop.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # Build locally (load into the runner's Docker daemon) so Trivy can scan
      # before we publish. Push happens only after the scan passes; the second
      # build is a 100% cache hit (same inputs → same digest as the scanned image).
      - name: Build (local, for scan)
        uses: docker/build-push-action@v5
        with:
          context: src/normalizer
          file: src/normalizer/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.image }}:sha-${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.image }}:sha-${{ steps.tags.outputs.short_sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          cache: true

      - name: Push (scan passed)
        uses: docker/build-push-action@v5
        with:
          context: src/normalizer
          file: src/normalizer/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.tags.outputs.image }}:sha-${{ steps.tags.outputs.short_sha }}
            ${{ steps.tags.outputs.image }}:main-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          sha_tag="${{ steps.tags.outputs.image }}:sha-${{ steps.tags.outputs.short_sha }}"
          latest_tag="${{ steps.tags.outputs.image }}:main-latest"
          {
            echo "## Pushed image tags"
            echo ""
            echo "- \`${sha_tag}\` (immutable — recommended for rollouts)"
            echo "- \`${latest_tag}\` (moving — convenient with imagePullPolicy: Always)"
          } >> "$GITHUB_STEP_SUMMARY"
